name: Past tenders (TED history)

on:
  workflow_dispatch: {}     # adds a "Run workflow" button
  schedule:
    - cron: "37 22 * * 0"   # Sundays 22:37 UTC: refresh past and new tenders ahead of the Monday database refresh
  push:
    branches: [main]
    paths: ["ted_history.py", "tender_db.py", ".github/workflows/history.yml"]

permissions:
  contents: write

concurrency:
  group: desk
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Search TED back to 2016
        run: python3 -u ted_history.py
      - name: Read hardware facts and split for the database
        run: python3 tender_db.py
      - name: Save
        run: |
          git config user.name "bikeshare-feeds bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A desk db/tenders
          git diff --cached --quiet && exit 0
          git commit -m "Tender history $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs origin main || exit 1; done
          exit 1
