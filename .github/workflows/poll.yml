name: Poll GBFS feeds and tenders

on:
  schedule:
    - cron: "17 3 * * 1"    # Mondays 03:17 UTC: feeds (night in Europe, bikes parked) and TED, ahead of the 05:35 UK database refresh
    - cron: "47 10 * * 3"   # Wednesdays 10:47 UTC: TED and portals, ahead of the 12:23 UK tender alert
    - cron: "41 6 * * *"    # daily 06:41 UTC: the slow portals only (UK Find a Tender, Brazil, Spain), a slice at a time
  workflow_dispatch: {}     # adds a "Run workflow" button
  push:
    branches: [main]
    paths: ["poll_feeds.py", "ted_tenders.py", "world_tenders.py", "split_for_db.py", ".github/workflows/poll.yml"]   # first run as soon as the files land

permissions:
  contents: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Poll GBFS feeds
        if: github.event.schedule != '47 10 * * 3' && github.event.schedule != '41 6 * * *'
        run: python3 poll_feeds.py
      - name: Split counts for the database
        if: github.event.schedule != '47 10 * * 3' && github.event.schedule != '41 6 * * *'
        run: python3 split_for_db.py
      - name: Search TED
        if: github.event.schedule != '41 6 * * *'
        run: python3 ted_tenders.py
        continue-on-error: true   # a TED outage mustn't lose the feed counts
      - name: Search national tender portals
        run: |
          if [ "${{ github.event.schedule }}" = "41 6 * * *" ]; then python3 -u world_tenders.py uk-fts br-pncp es-place; else python3 -u world_tenders.py; fi
        timeout-minutes: 25
        continue-on-error: true   # each portal is independent; failures are recorded in the file
      - name: Save
        if: always()
        run: |
          git config user.name "bikeshare-feeds bot"
          git config user.email "actions@users.noreply.github.com"
          for p in counts.json tenders.json world_tenders.json db; do [ -e "$p" ] && git add -A "$p"; done
          git diff --cached --quiet || git commit -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
