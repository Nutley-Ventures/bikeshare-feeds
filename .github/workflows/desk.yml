name: Desktop study sources

on:
  workflow_dispatch: {}     # adds a "Run workflow" button
  schedule:
    - cron: "23 4 2 * *"    # 2nd of each month, 04:23 UTC: refresh the reference data
  push:
    branches: [main]
    paths: ["desk_fetch.py", ".github/workflows/desk.yml"]

permissions:
  contents: write

concurrency:
  group: desk
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Wikipedia and Wikidata
        run: python3 -u desk_fetch.py
      - name: Save
        run: |
          git config user.name "bikeshare-feeds bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A desk
          git diff --cached --quiet && exit 0
          git commit -m "Desk sources $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -X theirs origin main || exit 1; done
          exit 1
